name: simlog_mobile
description: "Sistem Informasi Manajemen Logistik Rumah Sakit v2 - Mobile Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core State Management & Reactive UI
  flutter_riverpod: ^2.5.1

  # Networking & HTTP Client
  dio: ^5.4.3+1

  # Secure Storage & Persistence
  flutter_secure_storage: ^9.2.2

  # Barcode & QR Code Camera Scanner
  mobile_scanner: ^5.1.1

  # Camera & Image Picker
  image_picker: ^1.1.2

  # Typography & Design System Icons
  lucide_icons_flutter: ^3.1.20

  # Utilities
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
